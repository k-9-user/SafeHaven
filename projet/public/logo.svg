<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110">
  <!-- Shield body -->
  <path d="M50 4 L92 20 L92 56 C92 78 73 95 50 105 C27 95 8 78 8 56 L8 20 Z" fill="#0B1F4E"/>
  <!-- Shield border highlight -->
  <path d="M50 4 L92 20 L92 56 C92 78 73 95 50 105 C27 95 8 78 8 56 L8 20 Z" fill="none" stroke="#1565C0" stroke-width="2.5"/>

  <!-- Sound wave bars (centered at x=50, y~46) -->
  <rect x="22" y="38" width="7" height="16" rx="3.5" fill="#29B6F6"/>
  <rect x="32" y="30" width="7" height="32" rx="3.5" fill="#0288D1"/>
  <rect x="42" y="22" width="7" height="48" rx="3.5" fill="#01579B"/>
  <rect x="52" y="30" width="7" height="32" rx="3.5" fill="#0288D1"/>
  <rect x="62" y="38" width="7" height="16" rx="3.5" fill="#29B6F6"/>

  <!-- Dollar sign circle -->
  <circle cx="50" cy="80" r="9" fill="#00897B" opacity="0.9"/>
  <text x="50" y="85" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white">$</text>

  <!-- Green chevron at bottom of shield -->
  <path d="M30 92 L50 102 L70 92" fill="none" stroke="#43A047" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
